<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1e">
  <title>Website Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const year = document.getElementById("year");
      if (year) year.textContent = new Date().getFullYear();
    });
  </script>
</head>
<body>
  <main class="maintenance">
    <div class="top-label"><span class="status-dot"></span> TEMPORARILY UNAVAILABLE</div>

    <div class="content">
      <div class="icon-wrap" aria-hidden="true">
        <div class="icon-ring ring-one"></div>
        <div class="icon-ring ring-two"></div>
        <div class="hourglass">⌛</div>
      </div>

      <p class="eyebrow">WE'LL BE RIGHT BACK</p>
      <h1>WEBSITE UNDER<br><span>MAINTENANCE</span></h1>
      <p class="description">
        We are working behind the scenes to make things better.
        Thank you for your patience.
      </p>

      <div class="please-wait">
        <span class="wait-line"></span>
        <strong>PLEASE WAIT</strong>
        <span class="wait-dots"><i></i><i></i><i></i></span>
        <span class="wait-line"></span>
      </div>

      <div class="return-date">
        <span class="date-caption">WE EXPECT TO BE BACK ON</span>
        <strong>1<sup>st</sup> DECEMBER 2026</strong>
      </div>
    </div>

    <footer>
      <span>© <span id="year"></span> Gram Saathi</span>
      <span class="credit">Developed and Maintained by <b>Noob Coders</b></span>
    </footer>
  </main>
</body>
</html>
